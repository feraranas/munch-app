version: '3.8'

networks:
  loki:
services:
  frontend:
    container_name: frontend
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    labels: { logging: "promtail" }
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://loki:3100/loki/api/v1/push"
    #     loki-batch-size: "400"
    depends_on:
      - backend

  backend:
    container_name: backend
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    labels:
      - "logging=promtail"
      - "com.datadoghq.tags.service=backend"
      - "com.datadoghq.tags.env=dev"
      - "com.datadoghq.tags.version=0.0.1"
    volumes:
      - ./backend:/app
      - /app/bin
    environment:
      - GIN_MODE=debug
      - DD_SERVICE=munch-app-backend
      - DD_ENV=beta
      - DD_VERSION=0.0.1
      - DD_AGENT_HOST=datadog-agent
      - DD_SITE=us5.datadoghq.com
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgres://munch_user:munch_password@postgres:5432/munch_app_dev?sslmode=disable
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://loki:3100/loki/api/v1/push"
    #     loki-batch-size: "400"
    depends_on:
      - postgres
      - datadog-agent

  postgres:
    container_name: postgres
    image: postgres:15-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=munch_app_dev
      - POSTGRES_USER=munch_user
      - POSTGRES_PASSWORD=munch_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://loki:3100/loki/api/v1/push"
    #     loki-batch-size: "400"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munch_user -d munch_app_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  datadog-agent:
    container_name: datadog-agent
    image: "gcr.io/datadoghq/agent:latest"
    pid: host
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_SITE=us5.datadoghq.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://loki:3100/loki/api/v1/push"
    #     loki-batch-size: "400"

  loki:
    image: grafana/loki:main-02165db
    volumes:
      - ./data/loki:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - loki

  promtail:
    image: grafana/promtail:main-02165db
    volumes:
      - /var/log:/var/log
      - ./configs/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - loki

  grafana:
    image: grafana/grafana:main-ubuntu
    volumes:
      - ./configs/grafana.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3001"
    environment:
      - GF_SERVER_HTTP_ADDR=0.0.0.0
      - GF_SERVER_HTTP_PORT=3001
    restart: unless-stopped
    networks:
      - loki

volumes:
  postgres_data:
  grafana_data:
