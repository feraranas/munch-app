version: '3.8'

services:
  frontend:
    container_name: frontend
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    container_name: backend
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    labels:
      - com.datadoghq.tags.service="backend"
      - com.datadoghq.tags.env="dev"
      - com.datadoghq.tags.version="0.0.1"
    volumes:
      - ./backend:/app
      - /app/bin
    environment:
      - GIN_MODE=debug
      - DD_SERVICE=munch-app-backend
      - DD_ENV=beta
      - DD_VERSION=0.0.1
      - DD_AGENT_HOST=datadog-agent
      - DD_SITE=us5.datadoghq.com
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgres://munch_user:munch_password@postgres:5432/munch_app_dev?sslmode=disable
    depends_on:
      - postgres
      - datadog-agent

  postgres:
    container_name: postgres
    image: postgres:15-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=munch_app_dev
      - POSTGRES_USER=munch_user
      - POSTGRES_PASSWORD=munch_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munch_user -d munch_app_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  datadog-agent:
    container_name: datadog-agent
    image: "gcr.io/datadoghq/agent:latest"
    pid: host
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_SITE=us5.datadoghq.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro

volumes:
  postgres_data:
