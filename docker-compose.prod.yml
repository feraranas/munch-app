version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    # Remove volume mounts for production
    volumes: []

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
    # Remove volume mounts for production
    volumes: []
